services:
  postgres:
    image: postgres:16-alpine
    container_name: open-webui-postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - 'POSTGRES_DB=openwebui'
      - 'POSTGRES_USER=openwebui'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
    restart: unless-stopped

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - postgres
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      - 'WEBUI_SECRET_KEY='
      - 'WEBUI_NAME=BdREN AI'
      - 'DATABASE_URL=postgresql://openwebui:${POSTGRES_PASSWORD}@postgres:5432/openwebui'
      # No local Ollama — this deployment only talks to the remote vLLM server
      - 'ENABLE_OLLAMA_API=false'
      # Point at your vLLM server's OpenAI-compatible endpoint on the other machine (include the /v1 suffix)
      - 'OPENAI_API_BASE_URLS=http://<vllm-server-ip>:8000/v1'
      - 'OPENAI_API_KEYS=none'
      # Remote server over the network can be slower to answer "list models" than localhost;
      # default is 10s which can flake under load — give it more room
      - 'AIOHTTP_CLIENT_TIMEOUT_OPENAI_MODEL_LIST=30'
      # User memory: persist durable facts/preferences per user and inject them into future chats
      - 'ENABLE_MEMORIES=true'
      - 'ENABLE_MEMORY_SYSTEM_CONTEXT=true'
      - 'ENABLE_MEMORY_BACKGROUND_REVIEW=true'
      - 'MEMORIES_REVIEW_INTERVAL_TURNS=10'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  open-webui: {}
  postgres-data: {}
